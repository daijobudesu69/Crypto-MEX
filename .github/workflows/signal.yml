name: MEX signal

# Setiap jam, bukan tiap 4 jam. Antrean GitHub Actions bisa menunda cron
# sampai berjam-jam; menjalankan tiap jam berarti bar yang terlewat langsung
# disusul di run berikutnya. Bar yang sudah diproses dilewati, jadi tidak
# ada pesan yang dobel.
on:
  schedule:
    - cron: "10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mex-state
  cancel-in-progress: false

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Cari sinyal
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GSHEET_WEBHOOK_URL: ${{ secrets.GSHEET_WEBHOOK_URL }}
        run: python run_signal.py

      - name: Simpan state ke repo
        run: |
          git config user.name  "mex-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then
            echo "tidak ada perubahan state"
            exit 0
          fi
          git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          # Run lain mungkin sudah menulis duluan; rebase lalu coba lagi.
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          echo "::error::gagal push state setelah 3 percobaan"
          exit 1
