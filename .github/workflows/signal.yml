name: MEX signal

# Cron GitHub tidak dijamin jalan, dan diukur pada repo ini keandalannya hanya
# 23-26%: dari ~46 jadwal dalam 26 jam, cuma 12 yang benar-benar berjalan, dengan
# jeda terburuk 4j48m. Sinyal hangus 8 jam setelah bar-nya, dan bar 4H baru tutup
# 4 jam setelah dibuka, jadi jendela kirim efektif cuma 4 jam -- lebih pendek dari
# jeda terburuk itu. Pada 3 Sep 2026 lubang 11:31-16:19 UTC menelan HABIS jendela
# kirim bar 08:00; sinyal di bar itu akan hilang tanpa jejak.
#
# Menambah baris cron tidak menolong: yang bermasalah bukan jadwalnya, tapi
# GitHub yang tidak menjalankannya. Jadi polanya dibalik --
#
#   cron TIDAK LAGI bertugas melakukan pengecekan.
#   Tugasnya hanya MENYALAKAN pemantau yang lalu hidup ~5,5 jam dan mengecek
#   sendiri tiap 10 menit dari dalam.
#
# Satu cron yang berhasil menutupi 5,5 jam berikutnya. Dengan concurrency group,
# jadwal yang jatuh saat pemantau masih hidup akan ANTRE (GitHub menyimpan satu
# run pending per grup) lalu langsung mulai begitu yang lama habis -- jadi
# cakupannya nyaris nonstop meski sebagian besar cron tetap dibuang GitHub.
#
# Repo ini publik, dan menit GitHub Actions untuk repo publik tidak dibatasi,
# jadi job panjang tidak memakan kuota apa pun.
on:
  schedule:
    # Cukup sering supaya selalu ada yang menyalakan ulang kalau pemantau mati,
    # tapi tidak perlu padat lagi -- satu yang berhasil sudah menutupi 5,5 jam.
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "once = satu kali cek lalu selesai; loop = pantau ~5,5 jam"
        type: choice
        options: [once, loop]
        default: once

permissions:
  contents: write

concurrency:
  group: mex-state
  cancel-in-progress: false

jobs:
  signal:
    runs-on: ubuntu-latest
    # Batas keras job GitHub 6 jam. Anggaran loop di bawah 5j30m, sisanya untuk
    # setup dan penyimpanan state terakhir.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          # Riwayat penuh. Loop retry di save_state.sh melakukan rebase ke origin,
          # dan rebase di atas clone dangkal bisa gagal menemukan merge base --
          # artinya jalur pemulihan konflik rusak tepat saat dibutuhkan.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pantau sinyal
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GSHEET_WEBHOOK_URL: ${{ secrets.GSHEET_WEBHOOK_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GSHEET_SPREADSHEET_ID: ${{ secrets.GSHEET_SPREADSHEET_ID }}
          # Tanpa ini runs.csv dapat satu baris tiap 10 menit -- 144 baris dan
          # 144 commit per hari. Baris "tidak ada apa-apa" ditahan sampai 60 menit
          # berlalu; run yang benar-benar memproses bar atau gagal selalu dicatat.
          MEX_QUIET_IDLE: "1"
          MODE: ${{ inputs.mode || 'loop' }}
        run: |
          set -uo pipefail
          INTERVAL=600                    # cek tiap 10 menit
          DEADLINE=$(( $(date +%s) + 5*3600 + 30*60 ))
          worst=0
          n=0

          echo "[watch] mode=${MODE} interval=${INTERVAL}s"
          while :; do
            n=$((n + 1))
            echo "::group::cek #${n} — $(date -u '+%Y-%m-%d %H:%M:%SZ')"

            # Tarik state terbaru dulu. Tanpa ini, job yang checkout sebelum push
            # terakhir job sebelumnya mendarat akan memproses ulang bar yang
            # sudah selesai -- dan bisa mengirim sinyal dua kali.
            bash tools/refresh_state.sh || true

            python run_signal.py
            rc=$?
            if [ "$rc" -gt "$worst" ]; then worst=$rc; fi

            # Heartbeat harian menumpang di loop ini. Dulu dia punya cron sendiri
            # di 00:07 UTC -- slot paling padat di antrean GitHub -- dan datang
            # ~4 jam telat SETIAP hari. run_heartbeat.py sendiri yang memutuskan
            # apakah hari ini sudah terkirim, jadi 143 dari 144 panggilan harian
            # berhenti sebelum menyentuh jaringan.
            python run_heartbeat.py || echo "[watch] heartbeat gagal, diabaikan"

            if ! bash tools/save_state.sh "state: $(date -u +%Y-%m-%dT%H:%MZ)"; then
              echo "[watch] save_state gagal"
              worst=1
            fi
            echo "::endgroup::"

            if [ "${MODE}" = "once" ]; then break; fi
            if [ $(( $(date +%s) + INTERVAL )) -ge "$DEADLINE" ]; then
              echo "[watch] anggaran waktu habis; cron berikutnya akan menyalakan ulang"
              break
            fi
            sleep "$INTERVAL"
          done

          echo "[watch] selesai setelah ${n} kali cek (exit ${worst})"
          # exit non-nol kalau ada pesan yang masih tersangkut di outbox, supaya
          # GitHub mengirim email. Pesannya tetap dicoba ulang tiap cek.
          exit "$worst"
