name: MEX signal

# Cron GitHub tidak dijamin jalan. Diukur pada repo ini: dari ~16 jadwal per
# jam, hanya 4 yang benar-benar berjalan, dengan jeda terburuk 6 jam dan
# keterlambatan median 92 menit dari saat bar tutup. Sinyal hangus setelah 8
# jam, jadi jeda sebesar itu bisa membuat sinyal tidak pernah terkirim.
#
# Karena itu percobaan dipusatkan di jam-jam saat bar 4H benar-benar tutup
# (00/04/08/12/16/20 UTC) -- empat kali dalam satu jam pertama -- dengan cron
# tiap jam sebagai cadangan. Menit ganjil dipilih karena menit bulat adalah
# slot paling padat di antrean GitHub dan paling sering dibuang.
#
# Menjalankan lebih sering aman: bar yang sudah diproses dilewati, jadi tidak
# ada pesan yang dobel.
on:
  schedule:
    - cron: "7,23,39,53 0,4,8,12,16,20 * * *"
    - cron: "31 1,2,3,5,6,7,9,10,11,13,14,15,17,18,19,21,22,23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mex-state
  cancel-in-progress: false

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Riwayat penuh. Loop retry di bawah melakukan rebase ke origin, dan
          # rebase di atas clone dangkal (default fetch-depth: 1) bisa gagal
          # menemukan merge base -- artinya jalur pemulihan konflik justru rusak
          # tepat saat dibutuhkan. Repo ini kecil, clone penuh nyaris gratis.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Cari sinyal
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GSHEET_WEBHOOK_URL: ${{ secrets.GSHEET_WEBHOOK_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GSHEET_SPREADSHEET_ID: ${{ secrets.GSHEET_SPREADSHEET_ID }}
        run: python run_signal.py

      # always(): kalau run_signal.py keluar dengan kode 1 (feed mati, state
      # rusak, pesan masih di outbox) baris runs.csv dan outbox-nya JUSTRU yang
      # paling perlu tersimpan. Tanpa ini, run bermasalah menghapus jejaknya
      # sendiri dan runs.csv hanya berisi run yang sukses.
      - name: Simpan state ke repo
        if: always()
        run: |
          git config user.name  "mex-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then
            echo "tidak ada perubahan state"
            exit 0
          fi
          git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"

          for i in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "state tersimpan"
              exit 0
            fi
            echo "push ditolak; run lain menulis duluan, menggabungkan (percobaan $i)"
            git fetch origin "${GITHUB_REF_NAME}"
            if ! git rebase "origin/${GITHUB_REF_NAME}"; then
              # CSV digabung otomatis oleh merge=union di .gitattributes.
              # position.json diselesaikan berdasarkan ISI (last_bar terbaru,
              # sent_ids & outbox digabung), bukan berdasarkan sisi rebase --
              # "--theirs" dulu bisa memundurkan last_bar dan memicu kirim ulang.
              if git ls-files -u state/position.json | grep -q .; then
                python tools/merge_state.py state/position.json
              fi
              git add state/
              if git grep -qI --cached '^<<<<<<< ' -- state/ 2>/dev/null; then
                echo "::error::penanda konflik tersisa di state/, dibatalkan"
                git rebase --abort || true
                exit 1
              fi
              # JANGAN pernah "rebase --skip" di sini: itu membuang commit state
              # run ini sementara loop tetap melaporkan sukses -- ledger dan
              # Telegram jadi tidak sinkron tanpa satu pun peringatan. Kalau
              # rebase tidak bisa diselesaikan, batalkan dan ulangi siklus penuh.
              if ! GIT_EDITOR=true git rebase --continue; then
                git rebase --abort || true
                sleep $((i * 3))
                continue
              fi
            fi
            sleep $((i * 3))
          done
          echo "::error::gagal menyimpan state setelah 5 percobaan"
          exit 1
