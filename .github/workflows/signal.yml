name: MEX signal

# Setiap jam, bukan tiap 4 jam. Antrean GitHub Actions bisa menunda cron
# sampai berjam-jam; menjalankan tiap jam berarti bar yang terlewat langsung
# disusul di run berikutnya. Bar yang sudah diproses dilewati, jadi tidak
# ada pesan yang dobel.
on:
  schedule:
    - cron: "10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mex-state
  cancel-in-progress: false

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Cari sinyal
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GSHEET_WEBHOOK_URL: ${{ secrets.GSHEET_WEBHOOK_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GSHEET_SPREADSHEET_ID: ${{ secrets.GSHEET_SPREADSHEET_ID }}
        run: python run_signal.py

      - name: Simpan state ke repo
        run: |
          git config user.name  "mex-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then
            echo "tidak ada perubahan state"
            exit 0
          fi
          git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"

          for i in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "state tersimpan"
              exit 0
            fi
            echo "push ditolak; run lain menulis duluan, menggabungkan (percobaan $i)"
            git fetch origin "${GITHUB_REF_NAME}"
            if ! git rebase "origin/${GITHUB_REF_NAME}"; then
              # CSV digabung otomatis oleh merge=union di .gitattributes.
              # Yang tersisa hanya position.json, dan di situ hasil run INI yang
              # benar -- dia sudah memproses bar paling akhir. Dalam rebase,
              # "--theirs" berarti commit kita yang sedang diputar ulang.
              git checkout --theirs state/position.json 2>/dev/null || true
              git add state/
              GIT_EDITOR=true git rebase --continue || GIT_EDITOR=true git rebase --skip || { git rebase --abort || true; }
            fi
            sleep $((i * 3))
          done
          echo "::error::gagal menyimpan state setelah 5 percobaan"
          exit 1
