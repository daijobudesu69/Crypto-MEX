name: tests

on:
  push:
    branches: [main]
    paths-ignore: ["state/**", "**.md"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit test (offline, tidak menyentuh jaringan)
        run: python tests/test_strategy.py
      - name: Cek sumber data bisa dijangkau dari runner
        run: python tests/test_connectivity.py
