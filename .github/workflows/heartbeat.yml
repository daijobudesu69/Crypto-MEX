name: MEX heartbeat

# CADANGAN. Heartbeat harian normalnya dikirim oleh loop pemantau di signal.yml,
# yang hidup terus dan mengecek tiap 10 menit -- jadi pesannya datang <=10 menit
# dari target 00:00 UTC (07:00 WIB).
#
# Workflow ini hanya jaring pengaman untuk saat pemantau MATI, yang justru momen
# paling penting untuk tahu. Karena itu tidak apa-apa kalau dia telat: heartbeat
# yang telat itu sendiri adalah alarmnya.
#
# Cron lama "7 0 * * *" adalah penyebab keluhan aslinya: slot 00:0x UTC paling
# padat di antrean GitHub dan pesannya datang ~4 jam telat SETIAP hari (terukur
# 4j02m-4j10m empat hari berturut-turut, terburuk 7j04m). Sekarang dijadwalkan
# di beberapa jam yang lebih sepi; run_heartbeat.py sendiri yang menolak kirim
# kalau pemantau sudah mengirimkannya hari itu, jadi tidak akan dobel.
on:
  schedule:
    - cron: "23 1,5,9 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "kirim heartbeat sekarang walau hari ini sudah terkirim"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # Grup TERPISAH dari signal.yml. GitHub hanya menyimpan satu run "pending"
  # per concurrency group -- kalau berbagi grup dengan MEX signal (yang
  # dijadwalkan sampai 16x/hari), giliran heartbeat (1x/hari) nyaris selalu
  # tergusur diam-diam sebelum sempat jalan. Push ke state/ tetap aman dipisah
  # karena kedua workflow sudah punya retry+rebase sendiri di langkah commit.
  group: mex-heartbeat-state
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # rebase di loop retry butuh riwayat penuh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Kirim heartbeat
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GSHEET_WEBHOOK_URL: ${{ secrets.GSHEET_WEBHOOK_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GSHEET_SPREADSHEET_ID: ${{ secrets.GSHEET_SPREADSHEET_ID }}
          MEX_FORCE_HEARTBEAT: ${{ inputs.force && '1' || '0' }}
        run: |
          bash tools/refresh_state.sh || true
          python run_heartbeat.py

      - name: Simpan state ke repo
        if: always()
        run: |
          bash tools/save_state.sh "heartbeat: $(date -u +%Y-%m-%d)"
