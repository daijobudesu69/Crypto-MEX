name: MEX heartbeat

# Satu pesan per hari, hanya untuk memastikan repo masih hidup.
# 00:07 UTC = 07:07 WIB. Menit ganjil sengaja dipilih untuk menghindari
# antrean cron GitHub Actions yang paling padat di menit :00/:15/:30/:45.
on:
  schedule:
    - cron: "7 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Grup TERPISAH dari signal.yml. GitHub hanya menyimpan satu run "pending"
  # per concurrency group -- kalau berbagi grup dengan MEX signal (yang
  # dijadwalkan sampai 16x/hari), giliran heartbeat (1x/hari) nyaris selalu
  # tergusur diam-diam sebelum sempat jalan. Push ke state/ tetap aman dipisah
  # karena kedua workflow sudah punya retry+rebase sendiri di langkah commit.
  group: mex-heartbeat-state
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # rebase di loop retry butuh riwayat penuh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Kirim heartbeat
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GSHEET_WEBHOOK_URL: ${{ secrets.GSHEET_WEBHOOK_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GSHEET_SPREADSHEET_ID: ${{ secrets.GSHEET_SPREADSHEET_ID }}
        run: python run_heartbeat.py

      - name: Simpan state ke repo
        if: always()
        run: |
          git config user.name  "mex-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then
            echo "tidak ada perubahan state"
            exit 0
          fi
          git commit -m "heartbeat: $(date -u +%Y-%m-%d) [skip ci]"

          for i in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "state tersimpan"
              exit 0
            fi
            echo "push ditolak; run lain menulis duluan, menggabungkan (percobaan $i)"
            git fetch origin "${GITHUB_REF_NAME}"
            if ! git rebase "origin/${GITHUB_REF_NAME}"; then
              # Sama seperti signal.yml: CSV digabung union, position.json
              # diselesaikan berdasarkan isi, dan JANGAN pernah "rebase --skip"
              # -- itu membuang commit sambil melaporkan sukses.
              if git ls-files -u state/position.json | grep -q .; then
                python tools/merge_state.py state/position.json
              fi
              git add state/
              if git grep -qI --cached '^<<<<<<< ' -- state/ 2>/dev/null; then
                echo "::error::penanda konflik tersisa di state/, dibatalkan"
                git rebase --abort || true
                exit 1
              fi
              if ! GIT_EDITOR=true git rebase --continue; then
                git rebase --abort || true
                sleep $((i * 3))
                continue
              fi
            fi
            sleep $((i * 3))
          done
          echo "::error::gagal menyimpan state setelah 5 percobaan"
          exit 1
