# ─────────────────────────────────────────────────────────────────────────────
#  MEX forward test — konfigurasi
#
#  Parameter strategi di bawah ini SAMA PERSIS dengan yang lulus backtest
#  (MEX_BACKTEST_SPEC.md §2). Mengubahnya membuat forward test tidak lagi
#  sebanding dengan backtest — kalau diubah, catat tanggal dan alasannya
#  di CHANGELOG.md, jangan diam-diam.
# ─────────────────────────────────────────────────────────────────────────────

# Instrumen dan timeframe TIDAK diatur di sini.
#
# Repo ini dikunci ke ETHUSDT 4H, dan satu-satunya sumber kebenaran adalah
# SYMBOL / INTERVAL di mex/datafeed.py. Dulu ada kunci `symbol` dan `timeframe`
# di file ini, tapi datafeed.fetch() tidak pernah menerima keduanya -- mengisi
# `symbol: BTCUSDT` hanya mengganti LABEL di CSV dan pesan Telegram sementara
# data yang diunduh tetap ETH. config.load() sekarang menolak kunci-kunci itu
# supaya kesalahan yang sama tidak bisa terulang diam-diam.

# hyperliquid         = candle perp Hyperliquid -- data yang sama dengan backtest
#                       yang dipakai memilih 13 koin (backtest/hyperliquid/)
# gate_io_perp        = cadangan pertama kalau yang utama mati
# binance_spot_mirror = cadangan kedua (tidak ada untuk MNT dan HYPE)
prefer_source: hyperliquid

# MEX 3.0 -- eksekusi di Hyperliquid. Hanya menentukan UKURAN order yang
# ditulis di pesan sinyal; aturan strategi di bawah tidak terpengaruh.
#   order  = modal x risk_pct / jarak stop     (rugi saat kena stop = risk_pct)
#   margin = order / leverage                  (isolated: rugi maksimal = margin)
#   order < $10 (minimum Hyperliquid) dinaikkan ke $10, bukan dilewati
execution:
  venue:       hyperliquid
  margin_mode: isolated
  leverage:    4        # <= leverage maks semua koin (TAO & MNT maks 5x)
  # Modal = saldo akun saat entry (risiko 1% ikut membesar/mengecil). Pesan
  # sinyal membaca saldo live dari Hyperliquid; angka ini hanya cadangan kalau
  # saldo live tidak terbaca (pesan lalu menandainya "perkiraan").
  capital_usd: 100
  # Circuit breaker: kalau saldo USDC turun sejauh ini dari puncaknya, bot
  # berhenti membuka posisi baru (posisi terbuka tetap dijaga sampai selesai).
  # 40% = di atas drawdown terdalam skenario realistis B (39%) di laporan, jadi
  # hanya menyala kalau hasil lebih buruk dari itu. Lanjutkan / set ulang puncak
  # (mis. setelah withdraw), isi dengan teks yang BELUM pernah dipakai, mis.
  # tanggal-jam sekarang -- jalan di PowerShell, CMD maupun Git Bash:
  #   gh variable set MEX_BREAKER_RESET --body reset-20261001-0900 --repo daijobudesu69/Crypto-MEX
  max_drawdown_pct: 40
  # API wallet Hyperliquid: kuncinya di GitHub secret di bawah (nama saja, bukan
  # isinya). Maksimal 180 hari; setelah itu bot berhenti trading DAN berhenti
  # menggeser stop. Heartbeat mengingatkan mulai 14 hari sebelumnya. Perpanjang =
  # buat API wallet BARU, ganti isi secret, perbarui tanggal ini. Isi secret =
  # PRIVATE KEY API wallet (66 karakter: 0x + 64 hex), BUKAN alamatnya (42).
  # Nama secret ini juga harus dipakai di .github/workflows/signal.yml.
  agent_secret:      HYPE_API_WALLET_ADDRESS_MEX_BOT_66CHAR
  agent_valid_until: 2027-03-30
  # Alamat PUBLIK (aman di repo). account = akun yang memegang saldo dan posisi;
  # agent = alamat API wallet "MEX.bot". Executor menolak jalan kalau kunci di
  # secret tidak menghasilkan alamat agent ini, atau agent ini tidak terdaftar
  # di akun ini.
  account_address:   "0x123bb2a1FE74395a57081d48077C28c9cA55a93B"
  agent_address:     "0x329e707a50b77bd851d220d53efab0491960e797"   # MEX.bot, dibuat 2026-10-01

strategy:
  n_lookback:   20      # breakout: high > high tertinggi 20 bar sebelumnya
  vol_len:      20      # SMA volume
  vol_mult:     1.5     # volume harus > 1.5x rata-rata
  ema_fast:     20
  ema_slow:     50
  rsi_len:      14
  roc_len:      5       # rsi - rsi[5]
  rsi_confirm:  55.0    # RSI minimum untuk long
  atr_len:      14
  atr_sl_mult:  1.5     # 1R = 1.5 x ATR  -> ini juga callback rate trailing stop
  risk_pct:     1.0     # dipakai hanya untuk teks pesan; qty dihitung sendiri
  allow_shorts: true    # fade-short: breakout ke ATAS saat tren turun

  # Sinyal bisa telat sampai 6 jam kalau antrean GitHub Actions padat.
  entry_zone_r: 0.5     # entry masih sah dalam +/- 0.5R dari harga referensi
  expiry_hours: 8.0     # setelah ini sinyal dianggap hangus
