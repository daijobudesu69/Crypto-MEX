# ─────────────────────────────────────────────────────────────────────────────
#  MEX forward test — konfigurasi
#
#  Parameter strategi di bawah ini SAMA PERSIS dengan yang lulus backtest
#  (MEX_BACKTEST_SPEC.md §2). Mengubahnya membuat forward test tidak lagi
#  sebanding dengan backtest — kalau diubah, catat tanggal dan alasannya
#  di CHANGELOG.md, jangan diam-diam.
# ─────────────────────────────────────────────────────────────────────────────

# Instrumen dan timeframe TIDAK diatur di sini.
#
# Repo ini dikunci ke ETHUSDT 4H, dan satu-satunya sumber kebenaran adalah
# SYMBOL / INTERVAL di mex/datafeed.py. Dulu ada kunci `symbol` dan `timeframe`
# di file ini, tapi datafeed.fetch() tidak pernah menerima keduanya -- mengisi
# `symbol: BTCUSDT` hanya mengganti LABEL di CSV dan pesan Telegram sementara
# data yang diunduh tetap ETH. config.load() sekarang menolak kunci-kunci itu
# supaya kesalahan yang sama tidak bisa terulang diam-diam.

# binance_spot_mirror = data-api.binance.vision (96% sinyal cocok dgn backtest)
# gate_io_perp        = cadangan otomatis kalau yang utama mati
prefer_source: binance_spot_mirror

strategy:
  n_lookback:   20      # breakout: high > high tertinggi 20 bar sebelumnya
  vol_len:      20      # SMA volume
  vol_mult:     1.5     # volume harus > 1.5x rata-rata
  ema_fast:     20
  ema_slow:     50
  rsi_len:      14
  roc_len:      5       # rsi - rsi[5]
  rsi_confirm:  55.0    # RSI minimum untuk long
  atr_len:      14
  atr_sl_mult:  1.5     # 1R = 1.5 x ATR  -> ini juga callback rate trailing stop
  risk_pct:     1.0     # dipakai hanya untuk teks pesan; qty dihitung sendiri
  allow_shorts: true    # fade-short: breakout ke ATAS saat tren turun

  # Sinyal bisa telat sampai 6 jam kalau antrean GitHub Actions padat.
  entry_zone_r: 0.5     # entry masih sah dalam +/- 0.5R dari harga referensi
  expiry_hours: 8.0     # setelah ini sinyal dianggap hangus
